<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="程序员小U的个人电子名片，专注程序员与AI编程。" />
  <title>程序员小U | 个人电子名片</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbfbfd;
      --bg-soft: #f5f5f7;
      --text: #111113;
      --muted: #5f6368;
      --subtle: #8a8f98;
      --line: rgba(17, 17, 19, 0.12);
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --accent: #0066ff;
      --accent-strong: #0054d9;
      --accent-soft: rgba(0, 102, 255, 0.11);
      --shadow: 0 28px 80px rgba(10, 18, 34, 0.10);
      --avatar-shadow: 0 30px 110px rgba(0, 102, 255, 0.14);
      --radius: 28px;
      --nav-height: 72px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="graphite"] {
      color-scheme: dark;
      --bg: #09090b;
      --bg-soft: #111115;
      --text: #f7f7f8;
      --muted: #b6bac3;
      --subtle: #818895;
      --line: rgba(255, 255, 255, 0.14);
      --surface: rgba(24, 24, 28, 0.72);
      --surface-solid: #151519;
      --accent: #f5f5f7;
      --accent-strong: #ffffff;
      --accent-soft: rgba(255, 255, 255, 0.12);
      --shadow: 0 34px 90px rgba(0, 0, 0, 0.42);
      --avatar-shadow: 0 34px 110px rgba(255, 255, 255, 0.08);
    }

    [data-theme="blue"] {
      --bg: #f8fbff;
      --bg-soft: #edf5ff;
      --text: #08111f;
      --muted: #526171;
      --subtle: #778596;
      --line: rgba(0, 65, 140, 0.14);
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --accent: #0077ed;
      --accent-strong: #005fc7;
      --accent-soft: rgba(0, 119, 237, 0.12);
      --shadow: 0 30px 90px rgba(0, 90, 180, 0.13);
      --avatar-shadow: 0 34px 110px rgba(0, 119, 237, 0.18);
    }

    [data-theme="sunset"] {
      --bg: #fffaf6;
      --bg-soft: #fff0e5;
      --text: #1f130d;
      --muted: #6f5b4e;
      --subtle: #987c6b;
      --line: rgba(145, 75, 25, 0.14);
      --surface: rgba(255, 255, 255, 0.76);
      --surface-solid: #fffdfb;
      --accent: #ff7a45;
      --accent-strong: #e95720;
      --accent-soft: rgba(255, 122, 69, 0.14);
      --shadow: 0 30px 84px rgba(150, 70, 24, 0.13);
      --avatar-shadow: 0 34px 110px rgba(255, 122, 69, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 78% 18%, var(--accent-soft), transparent 32rem),
        linear-gradient(180deg, var(--bg), var(--bg-soft));
      color: var(--text);
      transition: background 260ms ease, color 260ms ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .site-shell {
      min-height: 100vh;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--nav-height);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: saturate(1.3) blur(22px);
      -webkit-backdrop-filter: saturate(1.3) blur(22px);
    }

    .nav-inner {
      width: min(1180px, calc(100% - 44px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--accent);
      background: var(--surface);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(16px, 4vw, 48px);
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a {
      position: relative;
      padding: 26px 0 24px;
      transition: color 180ms ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--text);
    }

    .nav-links a:first-child {
      color: var(--accent);
    }

    .nav-links a:first-child::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      border-radius: 999px 999px 0 0;
      background: var(--accent);
    }

    .hero {
      width: min(1180px, calc(100% - 44px));
      min-height: min(820px, calc(100vh - var(--nav-height) - 96px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(320px, 0.98fr);
      align-items: center;
      gap: clamp(36px, 6vw, 92px);
      padding: clamp(44px, 8vw, 96px) 0 clamp(36px, 6vw, 72px);
    }

    .hero-copy {
      max-width: 650px;
    }

    .title {
      margin: 0;
      max-width: 100%;
      font-size: clamp(56px, 7vw, 104px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .role {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(27px, 4vw, 46px);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: 0;
    }

    .intro {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2.3vw, 25px);
      line-height: 1.6;
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 38px;
    }

    .action {
      min-height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      color: var(--text);
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .action.primary {
      border-color: transparent;
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 16px 42px color-mix(in srgb, var(--accent) 26%, transparent);
    }

    [data-theme="graphite"] .action.primary {
      color: #09090b;
    }

    .action:hover,
    .action:focus-visible {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 46%, var(--line));
      outline: none;
    }

    .icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      display: block;
    }

    .theme-block {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
    }

    .theme-label {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .theme-switcher {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
    }

    .theme-option {
      width: 74px;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-align: center;
    }

    .theme-swatch {
      width: 46px;
      height: 46px;
      margin: 0 auto 8px;
      display: block;
      border-radius: 50%;
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bg) 70%, transparent);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .theme-option[aria-pressed="true"] .theme-swatch {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 0 2px color-mix(in srgb, var(--bg) 70%, transparent);
      transform: translateY(-2px);
    }

    .theme-name {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
    }

    .swatch-light {
      background: linear-gradient(135deg, #ffffff, #e7e9ee);
    }

    .swatch-graphite {
      background: linear-gradient(135deg, #111113, #5b6068);
    }

    .swatch-blue {
      background: linear-gradient(135deg, #f8fbff, #0077ed);
    }

    .swatch-sunset {
      background: linear-gradient(135deg, #fff8ef, #ff7557 55%, #ffcf6a);
    }

    .hero-visual {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .avatar-stage {
      position: relative;
      width: min(100%, 520px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .avatar-stage::before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: var(--surface-solid);
      box-shadow: var(--avatar-shadow);
      z-index: -2;
    }

    .avatar-stage::after {
      content: "";
      position: absolute;
      right: 3%;
      bottom: 7%;
      width: 28%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: var(--accent-soft);
      filter: blur(2px);
      z-index: -3;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 22px 44px rgba(0, 0, 0, 0.12));
    }

    .profile-strip {
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 88%, var(--surface-solid));
    }

    .profile-inner {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(320px, 1.12fr);
      gap: clamp(32px, 7vw, 108px);
      padding: clamp(44px, 7vw, 72px) 0;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: 0;
    }

    .about-copy {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.8;
      font-weight: 500;
    }

    .about-link {
      width: fit-content;
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 650;
    }

    .contact-list {
      display: grid;
      gap: 14px;
      margin-top: 2px;
    }

    .contact-item {
      min-height: 64px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.035);
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .contact-item:hover,
    .contact-item:focus-visible {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      outline: none;
    }

    .contact-label {
      font-size: 17px;
      font-weight: 700;
    }

    .contact-value {
      min-width: 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .external {
      width: 20px;
      height: 20px;
      color: var(--muted);
    }

    .footer {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 24px 0 34px;
      color: var(--subtle);
      font-size: 13px;
      font-weight: 550;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 860px) {
      :root {
        --nav-height: 64px;
      }

      .nav-inner {
        width: min(100% - 32px, 680px);
      }

      .nav-links {
        gap: 22px;
        font-size: 13px;
      }

      .nav-links a:nth-child(2),
      .nav-links a:nth-child(3) {
        display: none;
      }

      .hero {
        width: min(100% - 32px, 680px);
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 46px 0 42px;
        text-align: center;
      }

      .hero-copy {
        max-width: none;
      }

      .title {
        max-width: 100%;
        font-size: clamp(40px, 12vw, 58px);
        line-height: 1.08;
      }

      .role {
        margin-top: 20px;
      }

      .actions,
      .theme-block {
        justify-content: center;
      }

      .theme-block {
        flex-direction: column;
        gap: 15px;
      }

      .hero-visual {
        order: -1;
      }

      .avatar-stage {
        width: min(78vw, 380px);
      }

      .profile-inner {
        width: min(100% - 32px, 680px);
        grid-template-columns: 1fr;
        gap: 34px;
        padding: 40px 0 50px;
      }

      .footer {
        width: min(100% - 32px, 680px);
      }
    }

    @media (max-width: 560px) {
      .brand {
        font-size: 15px;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
      }

      .nav-links {
        gap: 18px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .action {
        width: 100%;
        min-height: 56px;
      }

      .theme-switcher {
        justify-content: center;
        gap: 10px;
      }

      .theme-option {
        width: 66px;
      }

      .theme-swatch {
        width: 42px;
        height: 42px;
      }

      .contact-item {
        grid-template-columns: auto minmax(0, 1fr) auto;
        min-height: 70px;
        padding: 12px 14px;
      }

      .contact-value {
        grid-column: 2 / 3;
        text-align: left;
        font-size: 14px;
      }

      .external {
        grid-column: 3;
        grid-row: 1 / span 2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

  <script>
    const themeButtons = Array.from(document.querySelectorAll("[data-theme-target]"));
    const themeNames = new Set(themeButtons.map((button) => button.dataset.themeTarget));
    const storedTheme = localStorage.getItem("xiaou-card-theme");
    const initialTheme = themeNames.has(storedTheme) ? storedTheme : "light";

    function applyTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem("xiaou-card-theme", theme);
      themeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.themeTarget === theme));
      });
    }

    themeButtons.forEach((button) => {
      button.addEventListener("click", () => applyTheme(button.dataset.themeTarget));
    });

    applyTheme(initialTheme);
  </script>
